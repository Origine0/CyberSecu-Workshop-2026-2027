- name: Vérifier que le service est dans la liste blanche
  ansible.builtin.assert:
    that:
      - service is defined
      - service in restart_whitelist
    fail_msg: "Service '{{ service | default('') }}' refusé. Autorisés : {{ restart_whitelist | join(', ') }}"
    quiet: true

- name: Lire l'heure de démarrage actuelle de {{ service }}
  ansible.builtin.uri:
    url: "{{ docker_api_url }}/containers/{{ container_prefix }}{{ service }}/json"
    unix_socket: "{{ docker_api_socket | default(omit, true) }}"
  register: before

# même appel que docker restart, via l'API Docker (la socket sur l'hôte, socket-proxy-remed dans le conteneur)
- name: Redémarrer {{ service }}
  ansible.builtin.uri:
    url: "{{ docker_api_url }}/containers/{{ container_prefix }}{{ service }}/restart?t=10"
    unix_socket: "{{ docker_api_socket | default(omit, true) }}"
    method: POST
    status_code: 204
    timeout: 30
  changed_when: true

- name: Attendre que {{ service }} soit healthy
  ansible.builtin.uri:
    url: "{{ docker_api_url }}/containers/{{ container_prefix }}{{ service }}/json"
    unix_socket: "{{ docker_api_socket | default(omit, true) }}"
  register: after
  until:
    - after.json.State.StartedAt != before.json.State.StartedAt
    - after.json.State.Health.Status == 'healthy'
  retries: "{{ health_retries }}"
  delay: "{{ health_delay }}"
