# WAF Nginx durci pour PROJECT RESILIENCE-ALPHA
# Conforme à la Section 5 : Filtrage d'accès, masquage des endpoints sensibles et blocage dynamique Ansible.

# DNS interne de Docker pour résolution dynamique
resolver 127.0.0.11 valid=10s ipv6=off;

# Upgrade WebSocket seulement si demandé par le client
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    # En-têtes de traçabilité IP (X-Forwarded-For & X-Real-IP) fixés sur la vraie IP source (anti-spoofing)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    10s;

    # Healthcheck du WAF lui-même
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ==============================================================================
    # 🛡️ LISTE DE BLOCAGE DYNAMIQUE DU WAF (Gérée par Ansible / Remédiation autonome)
    # ==============================================================================
    # Charge les règles de blocage générées par ansible/roles/waf_blocklist (IPs, User-Agents)
    include /etc/nginx/blocklist/*.conf;

    # seules ces routes de l'API sont accessibles, le reste (docs, metrics, waf/block...) est refusé
    location ~ ^/api/(pay|health|transactions|waf/status)$ {
        set $upstream_api http://payment-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
    }

    # Interdiction stricte de toute autre route de l'API (/api/docs, /api/metrics, /api/openapi.json)
    location /api/ {
        return 403;
    }

    # Service d'authentification
    location /auth/ {
        set $upstream_auth http://auth:8001;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $upstream_auth;
    }

    # assistant IA (Ollama/RAG) : réponses LLM lentes, timeout plus long
    location /ai/ {
        set $upstream_ai http://ai-api:8000;
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass $upstream_ai;
        proxy_read_timeout 60s;
    }

    # frontend Vite (le Upgrade permet le hot reload en dev)
    location / {
        set $upstream_front http://frontend:3000;
        proxy_http_version 1.1;
        # proxy_set_header dans un location annule ceux du server : on les répète
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Timeout long pour éviter la déconnexion WebSocket du HMR Vite (qui recharge la page toutes les 10s)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_pass $upstream_front;
    }
}
