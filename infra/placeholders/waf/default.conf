# Reverse proxy temporaire en attendant le WAF (pas de règles de filtrage ici).

# DNS de Docker : avec des variables, nginx résout les noms à chaque requête
# et démarre même si un service est arrêté.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    10s;

    # healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # seules ces routes de l'API sont accessibles, le reste (docs, metrics...) est refusé
    location ~ ^/api/(pay|health|transactions)$ {
        set $upstream_api http://payment-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
    }
    location /api/ {
        return 403;
    }

    location /auth/ {
        set $upstream_auth http://auth:8001;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $upstream_auth;
    }

    location / {
        set $upstream_front http://frontend:3000;
        proxy_pass $upstream_front;
    }
}
