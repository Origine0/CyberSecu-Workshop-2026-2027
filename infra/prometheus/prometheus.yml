# Cibles Prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # scrapé en direct sur le réseau app, pas via le waf
  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-api:8000"]

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8001"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # stats par conteneur
  - job_name: docker-stats
    scrape_timeout: 10s
    static_configs:
      - targets: ["docker-stats-exporter:9105"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: ml-detector
    scrape_interval: 5s  # même rythme que les mesures du détecteur : la riposte se voit tout de suite
    static_configs:
      - targets: ["ml-detector:8010"]

  - job_name: remediation
    scrape_interval: 5s  # même rythme que les mesures du détecteur : la riposte se voit tout de suite
    static_configs:
      - targets: ["remediation:8020"]
